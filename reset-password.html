
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | First Standard Multi Stores</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .reset-card {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin-top: 0;
            color: #222;
            font-size: 25px;
        }

        .intro {
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #d6a629;
            color: #171717;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #message.error {
            color: #b42318;
        }

        #message.success {
            color: #16713b;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #333;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <h1>Set a New Password</h1>

        <p class="intro">
            Enter your new password below to regain access to your
            First Standard Multi Stores customer account.
        </p>

        <form id="reset-form">
            <label for="new-password">New password</label>
            <input
                type="password"
                id="new-password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label for="confirm-password">Confirm new password</label>
            <input
                type="password"
                id="confirm-password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" id="reset-button">
                Update Password
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <a class="back-link" href="account.html">
            Return to Sign In
        </a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        (() => {
            const form = document.getElementById("reset-form");
            const newPassword = document.getElementById("new-password");
            const confirmPassword = document.getElementById("confirm-password");
            const button = document.getElementById("reset-button");
            const message = document.getElementById("message");

            function showMessage(text, type = "") {
                message.textContent = text;
                message.className = type;
            }

            function getSupabaseClient() {
                if (!window.supabase || !window.supabase.createClient) {
                    throw new Error(
                        "The account service could not load. Check your connection and refresh."
                    );
                }

                const url =
                    typeof SUPABASE_URL !== "undefined"
                        ? SUPABASE_URL
                        : "";

                const key =
                    typeof SUPABASE_PUBLISHABLE_KEY !== "undefined"
                        ? SUPABASE_PUBLISHABLE_KEY
                        : "";

                if (!url || !key) {
                    throw new Error(
                        "Supabase configuration was not detected."
                    );
                }

                return window.supabase.createClient(url, key);
            }

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const password = newPassword.value;
                const confirmation = confirmPassword.value;

                if (password.length < 8) {
                    showMessage(
                        "Your password must contain at least 8 characters.",
                        "error"
                    );
                    return;
                }

                if (password !== confirmation) {
                    showMessage(
                        "The passwords do not match. Please try again.",
                        "error"
                    );
                    return;
                }

                button.disabled = true;
                showMessage("Updating your password…");

                try {
                    const client = getSupabaseClient();

                    const { data, error: sessionError } =
                        await client.auth.getSession();

                    if (sessionError) {
                        throw sessionError;
                    }

                    if (!data.session) {
                        throw new Error(
                            "Your reset link may have expired or already been used. Request a new password reset email."
                        );
                    }

                    const { error } = await client.auth.updateUser({
                        password: password
                    });

                    if (error) {
                        throw error;
                    }

                    form.reset();

                    showMessage(
                        "Your password has been updated. You can now sign in with your new password.",
                        "success"
                    );
                } catch (error) {
                    console.error("Password reset error:", error);

                    showMessage(
                        error.message ||
                            "We could not update your password. Please request a new reset link.",
                        "error"
                    );
                } finally {
                    button.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
